---
wazuh_docker_dir: /etc/wazuh
wazuh_docker_version: v4.14.5
wazuh_admin_password: SecretPassword 
wazuh_docker_bind_volumes_on_host: True
# wazuh_docker_bind_volumes_on_host must be "true" for enable archives
wazuh_docker_disable_https_port: True
wazuh_docker_extra_volumes: []

# Specific ossec confs that will be merged with the default ones
# For examples check the default confs in vars->main.yml
wazuh_ossec_conf: {}
# Example
# wazuh_ossec_conf:
#   ossec_config:
#     global:
#     - logall: 'yes'
#       logall_json: 'yes'

wazuh_rules: []
# Example
# wazuh_local_rules:
#   filename: 10_example.xml
#   data: |
#     <!-- Local rules -->
#     <group name="local,syslog,sshd,">
#       <rule id="100001" level="5">
#         <some_conf>conf</some_conf>
#       </rule>
#
# wazuh_rules:
# - "{{ wazuh_local_rules }}"

# Uncomment this block for configure sending alerts to Telegram
# wazuh_telegram_integration:
#   chat_id: none
#   bot_token: none
#   alerts_level: 5
#   # proxy_url: http:127.0.0.1:123

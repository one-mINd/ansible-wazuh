---
- name: Restart Wazuh | down
  community.docker.docker_compose_v2:
    project_src: "{{ wazuh_docker_dir }}"
    state: absent

- name: Restart Wazuh | up
  community.docker.docker_compose_v2:
    project_src: "{{ wazuh_docker_dir }}"
    state: present

- name: Install python3-pip inside wazuh manager container
  community.docker.docker_container_exec:
    container: wazuh-wazuh.manager-1
    command: dnf install -y python3-pip

- name: Install requests library inside wazuh manager container
  community.docker.docker_container_exec:
    container: wazuh-wazuh.manager-1
    command: pip3 install requests
